server:
  port: 9500

spring:
  application:
    name: DriveMan

  # MySQL 数据源配置
  datasource:
    url: jdbc:mysql://localhost:3306/driveman?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
    # HikariCP 连接池配置
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-test-query: SELECT 1

  # Redis 配置（用于缓存等）
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000

  # 文件上传配置
  servlet:
    multipart:
      # 单个文件最大 5MB（开发阶段设小一点，后续可按需调大）
      max-file-size: 5MB
      # 单次请求最大 20MB
      max-request-size: 20MB

# MyBatis-Plus 配置
mybatis-plus:
  # XML 映射文件路径（使用自定义 SQL 时可放在此目录）
  mapper-locations: classpath:mapper/**/*.xml
  # 实体类包路径（自动别名）
  type-aliases-package: com.homework.driveman.entity
  global-config:
    db-config:
      # 主键策略：数据库自增
      id-type: auto
      # 逻辑删除字段名
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    # 数据库下划线命名 映射为 实体类驼峰命名
    map-underscore-to-camel-case: true
    # 控制台打印 SQL（开发环境方便调试）
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Knife4j 接口文档配置
knife4j:
  title: 驾校报名管理系统接口文档
  description: 驾校报名管理系统在线API文档
  contact:
    name: 开发团队
    email: dev@example.com

# 自定义配置: 文件上传存储根目录（相对项目根路径）
drive:
  upload:
    path: D:\java\DriveMan\upload-files
